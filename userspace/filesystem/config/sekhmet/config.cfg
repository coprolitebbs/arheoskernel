{main}
//cp866 Sekhmet
appname=Сехмет
prompt=$appname:[$cwd]>
greeting=Командная оболочка Сехмет загружена
greeting2=Наберите 'help' для отображения литании встроенных команд
cursor_code=0xB2
startup_path=/bin;/usbin

{help}
filename=sekhmet.hlp
notfound=Файл помощи /config/sekhmet/sekhmet.hlp не обнаружен

{wallpaper}
//png/tga
file=/config/img/ewall.png
//stretch or tile
flag=stretch

{aliases}
alias1_name=tt
alias1_cmd=thoth

{messages}
f_execute=Неизвестный ритуал или сущность:
wallp_load=Загрузка обоев
f_cd=cd: Файл или директория не существуют
exit_mess=Сессия оболочки завершена. Погружаемся во мрак.
awake_mess=Запускаем сущность
awake_failed=Ритуал провалился, сущность не проявилась.
